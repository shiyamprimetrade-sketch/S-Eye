name: S-Eye verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: seye --help
      - run: python scripts/smoke_installed.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark_stage86.py --output /tmp/stage86-report.json
      - run: python scripts/benchmark_localization.py --output /tmp/localization-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: vision-python-${{ matrix.python }}
          path: |
            /tmp/stage86-report.json
            /tmp/localization-report.json
