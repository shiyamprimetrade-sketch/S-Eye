name: S-Eye verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python stage85_fixture.py /tmp/s-eye-fixture --stress
      - run: python generalization.py --manifest /tmp/s-eye-fixture/manifest.json --output /tmp/stage85-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage85-python-${{ matrix.python }}
          path: /tmp/stage85-report.json
