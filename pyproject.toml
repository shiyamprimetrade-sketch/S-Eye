[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seye-independent"
version = "0.1.0.dev90"
description = "Experimental independent S-Eye geometric image analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow==13.0.0"]

[project.scripts]
seye = "seye.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
